# Example GitHub Actions workflow for this repository.
#
# It lives here rather than in .github/workflows/ because pushing a workflow
# file requires a token with the "Workflows" scope. To activate CI, copy this
# file to .github/workflows/ci.yml (via the GitHub web UI, or a push from a
# credential that has workflow permissions):
#
#     cp docs/ci.example.yml .github/workflows/ci.yml
#
# It runs the xUnit suite on every push and PR, once against the plugin's Python
# MCP server and once against the equivalent C# server. The suite drives the
# server over stdio and includes CommittedKnowledgeBaseIsConformant, which lints
# the committed kb/ and fails the build on OKF conformance errors.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the plugin's minimum
      - name: Test the Python server (what the plugin ships)
        run: dotnet test src/KnowledgeBase.Mcp.Tests -c Release
        env:
          KB_MCP_SERVER: python
      - name: Test the C# server
        run: dotnet test src/KnowledgeBase.Mcp.Tests -c Release
